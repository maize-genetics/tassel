name: TASSEL 5 CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    branches: [main, develop, master]
  # Also verify `develop` itself after a merge. The `main` -> `develop` back-merge
  # PR is opened by GITHUB_TOKEN, so no checks run on that PR; this is what
  # exercises a hotfix once it has been merged down.
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle.properties'

jobs:
  # Detect whether this PR touches compiled sources. The heavy test/coverage
  # job below is only meaningful for src/** changes, but it must still report a
  # status so it can be a *required* check: a job skipped via `if:` reports
  # "success" to branch protection, whereas a whole workflow skipped by a
  # top-level `paths:` filter stays "pending" and blocks docs-only PRs forever.
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    # dorny/paths-filter lists a PR's changed files through the REST API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changes under src/
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

  test_and_coverage:
    name: TASSEL 5 CI
    needs: changes
    # On `push` the workflow-level `paths:` filter has already decided the change
    # is relevant, so run unconditionally rather than re-deriving it from a
    # merge-base comparison against the default branch.
    if: ${{ needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Download and extract TASSEL test data
        run: |
          curl -L \
            -o tassel_test_data_v1.tar.gz \
            https://github.com/maize-genetics/tassel_test_data/releases/download/v1.0.0/tassel_test_data_v1.tar.gz

          tar -xzvf tassel_test_data_v1.tar.gz

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests, generate Kover report & verify coverage gate
        run: ./gradlew clean test koverXmlReport koverVerify --continue
        env:
          JAVA_TOOL_OPTIONS: >
            -Djava.library.path=/usr/lib/x86_64-linux-gnu

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: build/reports/tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_GLOBAL_TOKEN }}
          slug: maize-genetics/tassel
          files: build/reports/kover/report.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: TASSEL Test Report
          job_summary: true
          detailed_summary: true