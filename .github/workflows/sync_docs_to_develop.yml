name: Sync docs to develop

# Documentation changes merge straight to `main` so the site publishes without
# waiting on a promotion from `develop`. That leaves `main` ahead of `develop`,
# so this workflow opens a `main` -> `develop` pull request to bring the docs
# back down before the divergence turns into conflicts at promotion time.
#
# Two things worth knowing:
#   * PRs opened with GITHUB_TOKEN do not trigger other workflows, so no checks
#     run on the sync PR. That is acceptable for documentation content.
#   * The release automation's own `docs/changelog.md` commit in jdeploy.yml is
#     also pushed with GITHUB_TOKEN, so it does not trigger this workflow. Those
#     changelog updates ride along with the next docs sync (or a promotion).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-docs-to-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Open main to develop sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse the sync pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "No origin/develop branch; nothing to sync."
            exit 0
          fi

          AHEAD=$(git rev-list --count origin/develop..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "develop already contains everything on main; nothing to sync."
            exit 0
          fi
          echo "main is $AHEAD commit(s) ahead of develop."

          # An open sync PR keeps updating itself as main moves, so reuse it.
          EXISTING=$(gh pr list --base develop --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING is already open; it will pick up these commits."
            exit 0
          fi

          cat > sync_pr_body.md <<'BODY'
          Automated sync PR. Documentation changes merge directly to `main`, which
          leaves `develop` behind. Merging this keeps the two branches aligned so
          the next promotion does not have to resolve documentation conflicts.

          This PR may also carry hotfixes or release-automation commits that
          landed on `main` and are not yet on `develop`.

          Review the diff before merging: everything here is already on `main`, so
          conflicts should normally be resolved in favour of `main` unless
          `develop` has intentionally rewritten the same content.
          BODY

          gh pr create \
            --base develop \
            --head main \
            --title "Sync main into develop (documentation)" \
            --body-file sync_pr_body.md
