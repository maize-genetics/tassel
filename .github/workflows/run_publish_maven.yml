name: Publish TASSEL to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*'
      - '*.*.*'
      # Never publish nightly dev tags to Maven Central. Dot-free `dev-*` tags
      # already fail to match the version patterns above; this negative pattern
      # is an explicit belt-and-suspenders guard.
      - '!dev-*'
    branches: [main, master]
    # Skip docs-only branch pushes so documentation changes don't trigger a
    # Maven Central publish. Note: path filters are NOT evaluated for tag
    # pushes, so tag-triggered releases are unaffected by this.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'

jobs:

  maven-publish:

    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USER }}
      ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_TOKEN }}
      GPG_SIGNING_KEY: ${{ secrets.ORG_GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.ORG_GPG_SIGNING_PASSWORD }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.ORG_GPG_SIGNING_KEY }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.ORG_GPG_SIGNING_PASSWORD }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.ORG_GPG_PUBLIC_KEY }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.TASSEL_MAVEN }}
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USER }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{secrets.TASSEL_MAVEN}}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version from Gradle build file
        run: |
          RAW=$(./gradlew printVersion -q)
          # tail -n1 will skip all those progress-bar lines
          VERSION=$(echo "$RAW" | tail -n1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Stage artifacts for Maven Central
        run: ./gradlew jreleaserConfig && ./gradlew clean && ./gradlew publish

      # Maven Central is immutable, so a bad upload can only be corrected by cutting a
      # new version. Fail here rather than after deployment.
      - name: Verify staged artifacts
        run: .github/scripts/verify-staged-artifacts.sh "$VERSION"

      - name: Deploy staged artifacts to Maven Central
        run: ./gradlew jreleaserFullRelease -Dorg.gradle.jvmargs=\"-Xmx8g\"


