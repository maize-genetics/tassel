name: Nightly Dev Build

# Publishes an unstable prerelease ("nightly") standalone build from the
# `develop` branch, but only when develop has advanced since the last nightly.
# Releases to `main` are unaffected and remain manual via promotion PRs.

on:
  schedule:
    # 05:00 UTC daily.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  # Decide whether there is anything new to build. Skips silently when develop
  # has not moved since the previous nightly tag; manual dispatch always builds.
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      date_tag: ${{ steps.decide.outputs.date_tag }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        run: |
          DATE_TAG="dev-$(date -u +'%Y%m%d')"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"

          # Manual runs always build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: building."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Most recent existing nightly tag, if any.
          LAST_TAG=$(git tag -l 'dev-*' --sort=-creatordate | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous nightly tag; bootstrapping first build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SHA=$(git rev-list -n 1 "$LAST_TAG")
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Last nightly ($LAST_TAG) = $LAST_SHA"
          echo "develop HEAD            = $HEAD_SHA"
          if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            echo "No new commits since last nightly; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found; building."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish nightly
    needs: check
    if: ${{ needs.check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Download and extract TASSEL test data
        run: |
          curl -L \
            -o tassel_test_data_v1.tar.gz \
            https://github.com/maize-genetics/tassel_test_data/releases/download/v1.0.0/tassel_test_data_v1.tar.gz
          tar -xzf tassel_test_data_v1.tar.gz

      # Health check: a failing test suite fails the nightly and stops the
      # subsequent build/publish steps, signalling that develop is broken.
      - name: Run test suite (nightly health check)
        run: ./gradlew clean test --continue
        env:
          JAVA_TOOL_OPTIONS: >
            -Djava.library.path=/usr/lib/x86_64-linux-gnu

      - name: Read version from Gradle build file
        run: |
          RAW=$(./gradlew printVersion -q)
          VERSION=$(echo "$RAW" | tail -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Derive nightly tag and date
        run: |
          TAG="${{ needs.check.outputs.date_tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DATE=${TAG#dev-}" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew build -x test -x koverVerify

      - name: Create TASSEL "Standalone" distribution
        run: |
          mkdir -p dist/tassel-5-standalone
          cp -r build/libs/lib/ dist/tassel-5-standalone/
          cp build/libs/sTASSEL.jar dist/tassel-5-standalone/
          cp scripts/*.pl scripts/*.bat dist/tassel-5-standalone/

          cd dist/tassel-5-standalone

          for f in start_tassel.pl run_pipeline.pl; do
            sed -i.bak 's|push(@fl, "\$top/dist/sTASSEL.jar");|push(@fl, "\$top/sTASSEL.jar");|' "$f"
          done

          for f in start_tassel.bat run_pipeline.bat; do
            sed -i.bak 's|set CP=%TOP%\\dist\\sTASSEL.jar|set CP=%TOP%\\sTASSEL.jar|' "$f"
          done

          rm -f *.bak

      # Runs before the release is created, so a jar that cannot launch fails the
      # nightly instead of being published.
      - name: Verify standalone jar is runnable
        run: |
          JAR=dist/tassel-5-standalone/sTASSEL.jar

          # The listing goes to a file rather than straight into a pipe: `grep -q`
          # exits on its first match and closes the pipe, so the upstream `unzip`
          # dies of SIGPIPE and trips `pipefail`, which would report a perfectly
          # good jar as broken.
          LISTING=$(mktemp)
          unzip -l "$JAR" > "$LISTING"

          for CLS in net/maizegenetics/tassel/TASSELMainApp.class \
                     net/maizegenetics/pipeline/TasselPipeline.class; do
            grep -qF "$CLS" "$LISTING" || {
              echo "::error::$JAR is missing $CLS"; exit 1; }
          done

          # A sources jar carrying an executable manifest is the failure mode this guards.
          if grep -q '\.java$' "$LISTING"; then
            echo "::error::$JAR contains .java entries; it is a sources jar"; exit 1
          fi

      - name: Archive TASSEL Standalone (ZIP and TAR.GZ)
        run: |
          cd dist/tassel-5-standalone/
          zip -r ../tassel-5-standalone-v${VERSION}-dev.${DATE}.zip .
          tar -czf ../tassel-5-standalone-v${VERSION}-dev.${DATE}.tar.gz .

      - name: Write nightly release notes
        run: |
          {
            echo "Automated nightly build of the \`develop\` branch."
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "> Unstable prerelease for testing only. This is **not** an official release."
          } > RELEASE_NOTES_NIGHTLY.md

      - name: Publish nightly prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          TITLE="TASSEL ${VERSION}-dev.${DATE} (nightly)"

          # Idempotent: if a nightly for today already exists (e.g. a re-run or
          # a manual dispatch after the scheduled run), replace it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing it."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES_NIGHTLY.md \
            --prerelease \
            --target "$SHA" \
            dist/tassel-5-standalone-v${VERSION}-dev.${DATE}.zip \
            dist/tassel-5-standalone-v${VERSION}-dev.${DATE}.tar.gz

      - name: Prune old nightly prereleases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the newest 14 dev-* prereleases; delete older ones and their tags.
          KEEP=14
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))]
                  | sort_by(.createdAt) | reverse | .[].tagName' > all_dev_tags.txt

          tail -n +$((KEEP + 1)) all_dev_tags.txt | while read -r old_tag; do
            [ -n "$old_tag" ] || continue
            echo "Deleting old nightly $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done
